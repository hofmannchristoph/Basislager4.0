<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="assets/tokens.css">
<title>Anleitung — Basislager 4.0</title>
<style>
/* Der PDF-Betrachter des Bordbuchs. Er existiert, weil die App auf dem
   Homescreen ohne Browserleiste laeuft: Oeffnet sie ein PDF direkt, gibt
   es keinen Weg zurueck. Hier gibt es eine Kopfzeile mit Zurueck-Knopf —
   und eine Suche ueber die OCR-Textschicht der eingescannten Seiten. */
html{-webkit-text-size-adjust:100%;font-size:17px;font:-apple-system-body}
body{margin:0;background:#525659;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.kopf{position:fixed;left:0;right:0;top:0;z-index:10;
  background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid #EBEBEB;
  padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.zeile{display:flex;align-items:center;gap:10px}
.zurueck{display:inline-flex;align-items:center;gap:6px;border:0;background:#F7F7F7;color:#222;
  font-family:inherit;font-size:0.9118rem;font-weight:700;border-radius:99px;padding:9px 16px 9px 12px;cursor:pointer}
.zurueck svg,.lupe svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.titel{flex:1;min-width:0;font-size:0.8824rem;font-weight:700;color:#222;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seite{flex:0 0 auto;font-size:0.7353rem;font-weight:600;color:#717171;font-variant-numeric:tabular-nums}
.lupe{flex:0 0 auto;width:36px;height:36px;border:0;background:#F7F7F7;color:#222;border-radius:50%;
  display:grid;place-items:center;cursor:pointer}
.lupe[aria-pressed="true"]{background:#222;color:#fff}

/* Suchleiste, zweite Zeile im Kopf */
#sleiste{display:none;margin-top:9px}
#sleiste.offen{display:flex;gap:9px;align-items:center}
#sfeld{flex:1;min-width:0;border:1.5px solid #DDD;border-radius:99px;background:#fff;
  font-family:inherit;font-size:16px;color:#222;padding:9px 15px;outline:0}
#sfeld:focus{border-color:#222}

/* Trefferliste als Blatt unter dem Kopf */
#sliste{position:fixed;left:0;right:0;top:0;bottom:0;z-index:9;display:none;
  background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left))}
#sliste.offen{display:block}
#sliste .stand{font-size:0.7353rem;color:#717171;font-weight:600;margin:14px 2px 10px}
.treffer{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #EBEBEB;
  background:none;font-family:inherit;cursor:pointer;padding:12px 2px}
.treffer .ts{font-size:0.7353rem;font-weight:700;color:var(--bl-signal-text,#A8321F);margin-bottom:3px}
.treffer .tx{font-size:0.8529rem;color:#222;line-height:1.5;word-break:break-word}
.treffer mark{background:#FFE8AD;border-radius:3px;padding:0 1px}

#blaetter{padding:calc(64px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom))}
.blatt{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.blatt canvas{display:block;width:100%;height:100%}
#meldung{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:0.9412rem;
  font-weight:600;text-align:center;padding:0 30px;line-height:1.5}
#meldung.weg{display:none}
</style>
</head>
<body>
<header class="kopf">
  <div class="zeile">
    <button class="zurueck" type="button" id="zurueck">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Zurück
    </button>
    <p class="titel" id="titel">Anleitung</p>
    <p class="seite" id="seite"></p>
    <button class="lupe" type="button" id="lupe" aria-label="Im Dokument suchen" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </button>
  </div>
  <div id="sleiste">
    <input id="sfeld" type="search" placeholder="Im Dokument suchen"
      autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
      inputmode="search" enterkeyhint="search" aria-label="Im Dokument suchen">
  </div>
</header>
<div id="sliste"></div>
<div id="meldung">Anleitung wird geladen …</div>
<main id="blaetter"></main>

<script src="pdfjs/pdf.min.js"></script>
<script>
(function(){
'use strict';
var meldung=document.getElementById('meldung');
var seite=document.getElementById('seite');
var blaetter=document.getElementById('blaetter');
var lupe=document.getElementById('lupe');
var sleiste=document.getElementById('sleiste');
var sfeld=document.getElementById('sfeld');
var sliste=document.getElementById('sliste');

document.getElementById('zurueck').addEventListener('click', function(){
  if(history.length>1) history.back();
  else location.href='index.html';
});

/* Nur eigene Anleitungen aus dem eigenen Ordner, nichts Fremdes. */
var params=new URLSearchParams(location.search);
var d=params.get('d')||'';
if(!/^anleitungen\/[A-Za-z0-9._\/-]+\.pdf$/.test(d) || d.indexOf('..')>=0){
  meldung.textContent='Diese Datei gibt es nicht.';
  throw new Error('unzulaessiger Pfad');
}
var startSeite=Math.max(1, parseInt(params.get('s')||'1',10)||1);
var name=d.split('/').pop().replace(/\.pdf$/,'').replace(/^NB-\d+-/,'').replace(/-/g,' ');
document.getElementById('titel').textContent=name;
document.title=name+' — Basislager 4.0';

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Umlaut-tolerant, wie die Suche im Bordbuch. Die Karte fuehrt von der
   normalisierten Position zurueck zum Rohtext fuer den Ausschnitt. */
function normalisieren(t){
  var n='', karte=[];
  for(var i=0;i<t.length;i++){
    var ch=t[i].toLowerCase(), rep;
    if(ch==='ä')rep='ae'; else if(ch==='ö')rep='oe'; else if(ch==='ü')rep='ue';
    else if(ch==='ß')rep='ss'; else rep=ch;
    for(var k=0;k<rep.length;k++){ n+=rep[k]; karte.push(i); }
  }
  return {n:n, karte:karte};
}

pdfjsLib.GlobalWorkerOptions.workerSrc='pdfjs/pdf.worker.min.js';

pdfjsLib.getDocument({url:d}).promise.then(function(doc){
  meldung.classList.add('weg');
  var gesamt=doc.numPages;
  seite.textContent=Math.min(startSeite,gesamt)+' / '+gesamt;
  var breite=Math.min(document.documentElement.clientWidth||window.innerWidth||375, 900);
  if(breite<320) breite=375;
  var dpr=Math.min(window.devicePixelRatio||1, 2);

  /* ---------- Seiten: Platzhalter + Rendern beim Herankommen ---------- */
  function anlegen(n, verhaeltnis){
    var div=document.createElement('div');
    div.className='blatt'; div.dataset.n=n;
    div.style.width=breite+'px';
    div.style.height=Math.round(breite*verhaeltnis)+'px';
    blaetter.appendChild(div);
    io.observe(div); zio.observe(div);
  }
  function rendern(div){
    if(div.dataset.fertig) return;
    div.dataset.fertig='1';
    doc.getPage(parseInt(div.dataset.n,10)).then(function(p){
      var v=p.getViewport({scale:1});
      var vp=p.getViewport({scale:(breite/v.width)*dpr});
      var c=document.createElement('canvas');
      c.width=vp.width; c.height=vp.height;
      div.style.height=Math.round(vp.height/dpr)+'px';
      div.appendChild(c);
      /* intent print: rendert ohne requestAnimationFrame-Takt — das laeuft
         auch in Webviews durch, die den Takt drosseln oder schlucken. */
      p.render({canvasContext:c.getContext('2d'), viewport:vp, intent:'print'});
    });
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) rendern(e.target); });
  },{rootMargin:'1200px 0px'});
  var zio=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting) seite.textContent=e.target.dataset.n+' / '+gesamt;
    });
  },{rootMargin:'-45% 0px -45% 0px'});

  function zuSeite(n){
    var ziel=blaetter.children[n-1];
    if(!ziel) return;
    var r=ziel.getBoundingClientRect();
    window.scrollTo(0, window.pageYOffset + r.top - 64);
    seite.textContent=n+' / '+gesamt;
  }

  doc.getPage(1).then(function(p1){
    var v=p1.getViewport({scale:1});
    for(var n=1;n<=gesamt;n++) anlegen(n, v.height/v.width);
    if(startSeite>1) setTimeout(function(){ zuSeite(Math.min(startSeite,gesamt)); }, 50);
  });

  /* ---------- Suche ueber die OCR-Textschicht ---------- */
  var texte=[];          /* je Seite {roh, n, karte} */
  var gelesen=0;
  var liest=false;
  function einlesen(){
    if(liest || gelesen>=gesamt) return;
    liest=true;
    doc.getPage(gelesen+1).then(function(p){ return p.getTextContent(); })
      .then(function(tc){
        var roh=tc.items.map(function(it){return it.str;}).join(' ').replace(/\s+/g,' ');
        var norm=normalisieren(roh);
        texte.push({roh:roh, n:norm.n, karte:norm.karte});
        gelesen++; liest=false;
        if(sliste.classList.contains('offen')) suchen();
        if(gelesen<gesamt) setTimeout(einlesen, 0);
      })
      .catch(function(){ texte.push({roh:'',n:'',karte:[]}); gelesen++; liest=false;
        if(gelesen<gesamt) setTimeout(einlesen, 0); });
  }

  function suchen(){
    var q=normalisieren((sfeld.value||'').trim()).n;
    if(q.length<2){
      sliste.innerHTML='<p class="stand">Mindestens zwei Zeichen eingeben.'+
        (gelesen<gesamt?' Eingelesen: Seite '+gelesen+' von '+gesamt+' …':'')+'</p>';
      return;
    }
    var zeilen=[], gefunden=0;
    for(var s=0; s<gelesen && gefunden<60; s++){
      var t=texte[s], von=0, jeSeite=0;
      while(jeSeite<3 && gefunden<60){
        var i=t.n.indexOf(q, von);
        if(i<0) break;
        var a=t.karte[i], b=t.karte[Math.min(i+q.length-1, t.karte.length-1)]+1;
        var s0=Math.max(0,a-55), s1=Math.min(t.roh.length,b+75);
        var vorn=(s0>0?'… ':'')+esc(t.roh.slice(s0,a));
        var hinten=esc(t.roh.slice(b,s1))+(s1<t.roh.length?' …':'');
        zeilen.push('<button class="treffer" type="button" data-s="'+(s+1)+'">'+
          '<div class="ts">Seite '+(s+1)+'</div>'+
          '<div class="tx">'+vorn+'<mark>'+esc(t.roh.slice(a,b))+'</mark>'+hinten+'</div></button>');
        gefunden++; jeSeite++; von=i+q.length;
      }
    }
    var stand = gelesen<gesamt
      ? 'Durchsucht bis Seite '+gelesen+' von '+gesamt+' — es kommt noch mehr …'
      : (gefunden ? gefunden+' Treffer' : 'Keine Treffer — die Scans haben eine automatische Texterkennung, nicht jedes Wort wurde sauber erkannt.');
    sliste.innerHTML='<p class="stand">'+stand+'</p>'+zeilen.join('');
  }

  function sucheAuf(){
    lupe.setAttribute('aria-pressed','true');
    sleiste.classList.add('offen');
    sliste.classList.add('offen');
    sliste.style.paddingTop=(document.querySelector('.kopf').offsetHeight+6)+'px';
    suchen(); einlesen();
    setTimeout(function(){ sfeld.focus(); }, 30);
  }
  function sucheZu(){
    lupe.setAttribute('aria-pressed','false');
    sleiste.classList.remove('offen');
    sliste.classList.remove('offen');
    sfeld.blur();
  }
  lupe.addEventListener('click', function(){
    sliste.classList.contains('offen') ? sucheZu() : sucheAuf();
  });
  sfeld.addEventListener('input', suchen);
  sfeld.addEventListener('keydown', function(e){ if(e.key==='Escape') sucheZu(); });
  sliste.addEventListener('click', function(ev){
    var b=ev.target.closest ? ev.target.closest('.treffer') : null;
    if(!b) return;
    sucheZu();
    zuSeite(parseInt(b.dataset.s,10));
  });

}).catch(function(e){
  meldung.classList.remove('weg');
  meldung.textContent = navigator.onLine===false
    ? 'Kein Empfang — diese Anleitung braucht Internet.'
    : 'Die Anleitung liess sich nicht laden. Empfang prüfen und nochmals versuchen.';
});
})();
</script>
</body>
</html>
