<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Anleitung — Basislager 4.0</title>
<style>
/* Der PDF-Betrachter des Bordbuchs. Er existiert, weil die App auf dem
   Homescreen ohne Browserleiste laeuft: Oeffnet sie ein PDF direkt, gibt
   es keinen Weg zurueck. Hier gibt es eine Kopfzeile mit Zurueck-Knopf. */
html{-webkit-text-size-adjust:100%;font-size:17px;font:-apple-system-body}
body{margin:0;background:#525659;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.kopf{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid #EBEBEB;
  padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.zurueck{display:inline-flex;align-items:center;gap:6px;border:0;background:#F7F7F7;color:#222;
  font-family:inherit;font-size:0.9118rem;font-weight:700;border-radius:99px;padding:9px 16px 9px 12px;cursor:pointer}
.zurueck svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.titel{flex:1;min-width:0;font-size:0.8824rem;font-weight:700;color:#222;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seite{flex:0 0 auto;font-size:0.7353rem;font-weight:600;color:#717171;font-variant-numeric:tabular-nums}
#blaetter{padding:calc(64px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom))}
.blatt{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.blatt canvas{display:block;width:100%;height:100%}
#meldung{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font-size:0.9412rem;
  font-weight:600;text-align:center;padding:0 30px;line-height:1.5}
#meldung.weg{display:none}
</style>
</head>
<body>
<header class="kopf">
  <button class="zurueck" type="button" id="zurueck">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Zurück
  </button>
  <p class="titel" id="titel">Anleitung</p>
  <p class="seite" id="seite"></p>
</header>
<div id="meldung">Anleitung wird geladen …</div>
<main id="blaetter"></main>

<script src="pdfjs/pdf.min.js"></script>
<script>
(function(){
'use strict';
var meldung=document.getElementById('meldung');
var seite=document.getElementById('seite');
var blaetter=document.getElementById('blaetter');

document.getElementById('zurueck').addEventListener('click', function(){
  if(history.length>1) history.back();
  else location.href='index.html';
});

/* Nur eigene Anleitungen aus dem eigenen Ordner, nichts Fremdes. */
var d=new URLSearchParams(location.search).get('d')||'';
if(!/^anleitungen\/[A-Za-z0-9._\/-]+\.pdf$/.test(d) || d.indexOf('..')>=0){
  meldung.textContent='Diese Datei gibt es nicht.';
  throw new Error('unzulaessiger Pfad');
}
var name=d.split('/').pop().replace(/\.pdf$/,'').replace(/^NB-\d+-/,'').replace(/-/g,' ');
document.getElementById('titel').textContent=name;
document.title=name+' — Basislager 4.0';

pdfjsLib.GlobalWorkerOptions.workerSrc='pdfjs/pdf.worker.min.js';

pdfjsLib.getDocument({url:d}).promise.then(function(doc){
  meldung.classList.add('weg');
  var gesamt=doc.numPages;
  seite.textContent='1 / '+gesamt;
  var breite=Math.min(document.documentElement.clientWidth||window.innerWidth||375, 900);
  if(breite<320) breite=375;
  var dpr=Math.min(window.devicePixelRatio||1, 2);

  /* Platzhalter fuer alle Seiten anlegen; gerendert wird erst, wenn ein
     Blatt in die Naehe des Bildschirms kommt — sonst frisst ein
     124-Seiten-Scan den Speicher des Telefons. */
  var haltbar={};
  function anlegen(n, verhaeltnis){
    var div=document.createElement('div');
    div.className='blatt'; div.dataset.n=n;
    div.style.width=breite+'px';
    div.style.height=Math.round(breite*verhaeltnis)+'px';
    blaetter.appendChild(div);
    io.observe(div);
  }
  function rendern(div){
    var n=parseInt(div.dataset.n,10);
    if(div.dataset.fertig) return;
    div.dataset.fertig='1';
    doc.getPage(n).then(function(p){
      var v=p.getViewport({scale:1});
      var scale=breite/v.width;
      var vp=p.getViewport({scale:scale*dpr});
      var c=document.createElement('canvas');
      c.width=vp.width; c.height=vp.height;
      div.style.height=Math.round(vp.height/dpr)+'px';
      div.appendChild(c);
      /* intent print: rendert ohne requestAnimationFrame-Takt — das laeuft
         auch in Webviews durch, die den Takt drosseln oder schlucken. */
      p.render({canvasContext:c.getContext('2d'), viewport:vp, intent:'print'});
    });
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting) rendern(e.target); });
  },{rootMargin:'1200px 0px'});

  /* Erste Seite bestimmt das Standardformat der Platzhalter. */
  doc.getPage(1).then(function(p1){
    var v=p1.getViewport({scale:1});
    var verhaeltnis=v.height/v.width;
    for(var n=1;n<=gesamt;n++) anlegen(n, verhaeltnis);
  });

  /* Seitenzaehler beim Rollen nachfuehren. */
  var zio=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(e.isIntersecting) seite.textContent=e.target.dataset.n+' / '+gesamt;
    });
  },{rootMargin:'-45% 0px -45% 0px'});
  new MutationObserver(function(){
    blaetter.querySelectorAll('.blatt:not([data-zio])').forEach(function(b){
      b.dataset.zio='1'; zio.observe(b);
    });
  }).observe(blaetter,{childList:true});

}).catch(function(e){
  meldung.classList.remove('weg');
  meldung.textContent = navigator.onLine===false
    ? 'Kein Empfang — diese Anleitung braucht Internet.'
    : 'Die Anleitung liess sich nicht laden. Empfang prüfen und nochmals versuchen.';
});
})();
</script>
</body>
</html>
